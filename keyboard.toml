# Saurus keyboard - RMK configuration
# 36-key split keyboard (3x5 + 3 thumb keys per side)
# Hardware: Seeed XIAO BLE (nRF52840), col2row diodes

[rmk]
morse_max_num = 13

[keyboard]
name = "Saurus"
product_name = "Saurus"
vendor_id = 0x4C53
product_id = 0x5352
manufacturer = "Vizor"
chip = "nrf52840"
# Keep USB enabled so the central half works as wired HID/Vial when plugged in.
# BLE remains enabled below for wireless host connections and the split link.
usb_enable = true

[chip.nrf52840]
# The original XIAO nRF52840 has the REG1 DCC inductor populated. Its DCCH
# pin is not connected, so the high-voltage REG0 DC/DC must remain disabled.
dcdc_reg0 = false
dcdc_reg1 = true
dcdc_reg0_voltage = "3V3"

# Layout: 4 rows x 10 cols (split across two halves)
# Positions (3,0), (3,1), (3,8), (3,9) are not wired (no keys there)
[layout]
rows = 4
cols = 10
map = """
(0,0,L)  (0,1,L)  (0,2,L)  (0,3,L)  (0,4,L)    (0,5,R)  (0,6,R)  (0,7,R)  (0,8,R)  (0,9,R)
(1,0,L)  (1,1,L)  (1,2,L)  (1,3,L)  (1,4,L)    (1,5,R)  (1,6,R)  (1,7,R)  (1,8,R)  (1,9,R)
(2,0,L)  (2,1,L)  (2,2,L)  (2,3,L)  (2,4,L)    (2,5,R)  (2,6,R)  (2,7,R)  (2,8,R)  (2,9,R)
                  (3,2,*)  (3,3,L)  (3,4,*)    (3,5,*)  (3,6,R)  (3,7,*)
"""

# Aliases for dual-role keys, shifted symbols, and macOS shortcuts
[aliases]
# Dual-role alpha keys
N_LSHIFT = "MT(N, LShift, SHIFT)"
S_LCTRL  = "MT(S, LCtrl, HRM)"
H_LGUI   = "MT(H, LGui, HRM)"
T_SYM    = "LT(sym, T, HRM)"
C_SYM    = "LT(sym, C, HRM)"
A_RGUI   = "MT(A, RGui, HRM)"
E_RCTRL  = "MT(E, RCtrl, HRM)"
I_RSHIFT = "MT(I, RShift, SHIFT)"
# Dual-role thumb keys
TAB_SYM        = "LT(sym, Tab, FH)"
R_NUM          = "LT(num, R, PH)"
ENTR_CTRL = "LT(controls, Enter, TH)"
SPACE_NAV      = "LT(nav, Space, FH)"
ESC_RSHIFT     = "MT(GraveEscape, RShift, FH)"

# Shifted symbols
PLUS  = "WM(Equal, LShift)"
STAR  = "WM(Kc8, LShift)"
EXCL  = "WM(Kc1, LShift)"
AT_S  = "WM(Kc2, LShift)"
HASH  = "WM(Kc3, LShift)"
DLLR  = "WM(Kc4, LShift)"
PRCNT = "WM(Kc5, LShift)"
CARET = "WM(Kc6, LShift)"
AMPR  = "WM(Kc7, LShift)"
LPAR  = "WM(Kc9, LShift)"
RPAR  = "WM(Kc0, LShift)"
PIPE  = "WM(Backslash, LShift)"
LCBR  = "WM(LeftBracket, LShift)"
RCBR  = "WM(RightBracket, LShift)"
LT_S  = "WM(Comma, LShift)"
GT_S  = "WM(Dot, LShift)"
COLN  = "WM(Semicolon, LShift)"
TILD  = "WM(Grave, LShift)"
UNDS  = "WM(Minus, LShift)"
QUES  = "WM(Slash, LShift)"
# macOS shortcuts
MAC_UNDO   = "WM(Z, LGui)"
MAC_CUT    = "WM(X, LGui)"
MAC_COPY   = "WM(C, LGui)"
MAC_PASTE  = "WM(V, LGui)"
MAC_LOGOUT = "WM(Q, LCtrl | LGui)"

# Layer 0: "dusk" - base alpha layer (modified Night layout with home row mods)
# ┌───┬───┬───┬───┬───┐   ┌───┬───┬───┬───┬───┐
# │ B │ F │ L │ D │ Q │   │ ' │ W │ O │ U │ Y │
# ├───┼───┼───┼───┼───┤   ├───┼───┼───┼───┼───┤
# │N/⇧│S/⌃│H/⌘│T/Sym│ K │   │ J │C/Sym│A/⌘│E/⌃│I/⇧│
# ├───┼───┼───┼───┼───┤   ├───┼───┼───┼───┼───┤
# │ X │ V │ M │ G │ Z │   │ - │ P │ , │ . │ / │
# └───┴───┼───┼───┼───┤   ├───┼───┼───┼───┴───┘
#         │Tab/Sym│R/Num│Ent/Ctl│   │Bsp│Spc/Nav│Esc/⇧│
#         └──────┴────┴──────┘   └───┴──────┴─────┘
[keymap]
layers = 5

[[keymap.layer]]
name = "dusk"
keys = """
B          F         L        D        Q       Quote        W          O          U         Y
@N_LSHIFT  @S_LCTRL  @H_LGUI  @T_SYM   K       J            @C_SYM     @A_RGUI    @E_RCTRL  @I_RSHIFT
X          V         M        G        Z       Minus        P          Comma      Dot       Slash
                              @TAB_SYM @R_NUM  @ENTR_CTRL   Backspace  @SPACE_NAV @ESC_RSHIFT
"""

# RMK resolves simultaneously active layers from the highest index down. Keep
# sym below num/nav so either nested momentary layer can override it.
# Layer 1: "sym" - symbols
# ┌───┬───┬───┬───┬───┐   ┌───┬───┬───┬───┬───┐
# │ ^ │ < │ > │ - │ | │   │ ` │ { │ } │ & │ \ │
# ├───┼───┼───┼───┼───┤   ├───┼───┼───┼───┼───┤
# │ _ │ * │ / │ = │ $ │   │ # │ ( │ ) │ ; │ : │
# ├───┼───┼───┼───┼───┤   ├───┼───┼───┼───┼───┤
# │ ! │ + │ [ │ ] │ % │   │ ~ │ @ │ , │ . │ ? │
# └───┴───┼───┼───┼───┤   ├───┼───┼───┼───┴───┘
#         │Tab│Num│Ent│   │Bsp│Nav│Esc│
#         └───┴───┴───┘   └───┴───┴───┘
[[keymap.layer]]
name = "sym"
keys = """
@CARET        @LT_S         @GT_S         Minus         @PIPE            Grave         @LCBR         @RCBR         @AMPR         Backslash
@UNDS         @STAR         Slash         Equal         @DLLR            @HASH         @LPAR         @RPAR         Semicolon     @COLN
@EXCL         @PLUS         LeftBracket   RightBracket  @PRCNT           @TILD         @AT_S         Comma         Dot           @QUES
                            Tab           MO(num)       Enter            Backspace     MO(nav)       Escape
"""

# Layer 2: "num" - numbers and macOS editing shortcuts
# ┌────┬────┬────┬────┬────┐   ┌───┬───┬───┬───┬───┐
# │    │    │    │    │    │   │ + │ 7 │ 8 │ 9 │ * │
# ├────┼────┼────┼────┼────┤   ├───┼───┼───┼───┼───┤
# │ ⇧  │ ⌃  │ ⌘  │ ⌥  │ CW │   │ - │ 4 │ 5 │ 6 │ 0 │
# ├────┼────┼────┼────┼────┤   ├───┼───┼───┼───┼───┤
# │Undo│Cut │Copy│Pste│    │   │ = │ 1 │ 2 │ 3 │ / │
# └────┴────┼────┼────┼────┤   ├───┼───┼───┼───┴───┘
#           │    │    │    │   │Bsp│Spc│ . │
#           └────┴────┴────┘   └───┴───┴───┘
[[keymap.layer]]
name = "num"
keys = """
No            No            No            No            No               @PLUS         Kc7    Kc8   Kc9   @STAR
LShift        LCtrl         LGui          LAlt          CapsWordToggle   Minus         Kc4    Kc5   Kc6   Kc0
@MAC_UNDO     @MAC_CUT      @MAC_COPY     @MAC_PASTE    No               Equal         Kc1    Kc2   Kc3   Dot
                            _             _             _                Backspace     Space  Slash
"""

# Layer 3: "nav" - navigation and media controls
# ┌────┬────┬────┬────┬────┐   ┌────┬────┬────┬────┬────────┐
# │    │ ⏮  │ ⏯  │ ⏭  │    │   │    │Mute│Vol-│Vol+│Logout  │
# ├────┼────┼────┼────┼────┤   ├────┼────┼────┼────┼────────┤
# │ ⇧  │ ⌃  │ ⌘  │ ⌥  │ CW │   │    │ ←  │ ↓  │ ↑  │  →     │
# ├────┼────┼────┼────┼────┤   ├────┼────┼────┼────┼────────┤
# │    │    │    │    │    │   │    │Home│PgDn│PgUp│  End   │
# └────┴────┼────┼────┼────┤   ├────┼────┼────┼────┴────────┘
#           │    │ ⌥  │Ent │   │    │    │    │
#           └────┴────┴────┘   └────┴────┴────┘
[[keymap.layer]]
name = "nav"
keys = """
No            MediaPrevTrack  MediaPlayPause  MediaNextTrack  No               @MAC_LOGOUT   AudioMute     AudioVolDown  AudioVolUp    Escape
LShift        LCtrl           LGui            LAlt            CapsWordToggle   No            Left          Down          Up            Right
No            No              No              No              No               No            Home          PageDown      PageUp        End
                              MO(sym)         MO(num)         Enter             _             _             _
"""

# Layer 4: "controls" - Bluetooth profile and output controls
# User0..2 = BT profiles, User3/4 = next/previous, User5 = clear current BT bond,
# User6 = toggle USB/BLE output, User7 = clear split peer after a 5s hold.
[[keymap.layer]]
name = "controls"
keys = """
User0         User1         User2         User3         User4            User5         User6         User7         No            No
No            No            No            No            No               No            No            No            No            No
@MAC_UNDO     @MAC_CUT      @MAC_COPY     @MAC_PASTE    No               No            No            No            No            No
                            _             _             _                _             _             _
"""

# Behavior: tap-hold tuning for home row mods
[behavior.morse]
enable_flow_tap = true
hold_timeout = "250ms"
gap_timeout = "250ms"
quick_tap_timeout = "250ms"
prior_idle_time = "100ms"

[behavior.morse.profiles]
# This profile is recommended on the home row, when enable_flow_tap = true, and the hold action activates a layer or acts as a modifier (aka home row mod)
HRM = { permissive_hold = true, unilateral_tap = true, hold_timeout = "400ms" }
SHIFT = { permissive_hold = true, unilateral_tap = true, hold_timeout = "400ms" }
FH = { hold_on_other_press = true, enable_flow_tap = false, hold_timeout = "200ms" }
PH = { permissive_hold = true, enable_flow_tap = false, hold_timeout = "200ms" }
TH = { normal_mode = true, enable_flow_tap = false, hold_timeout = "200ms" }

[storage]
# Default nRF52840 storage location
start_addr = 0x000A0000
num_sectors = 8
# Set to true for one flash only when you intentionally want to wipe Vial,
# BLE bonds, selected BLE profile, and split peer storage.
clear_storage = false

[ble]
enabled = true
passkey_entry = true

[host]
# Hold the top-left and top-right keys on the base layer to unlock Vial.
unlock_keys = [[0, 0], [0, 9]]

# Split keyboard configuration
# Left half = central (connects to host via BLE/USB)
# Right half = peripheral (connects to central via BLE)
[split]
connection = "ble"

[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
ble_addr = [0x18, 0xe2, 0x21, 0x80, 0xc0, 0xc7]
# P0.14 (held low) and P0.31/SAADC are initialized together in src/xiao.rs
# so the divider is safe before ADC setup. Acquisition is 40us with 16x oversampling.

[split.central.matrix]
matrix_type = "normal"
# RMK uses col2row as default - matches the Saurus PCB diode direction
# row_pins = physical matrix rows (sense/input)
# col_pins = physical matrix columns (drive/output)
# XIAO BLE pin mapping: D0=P0_02, D1=P0_03, D2=P0_28, D3=P0_29,
#   D6=P1_11, D7=P1_12, D8=P1_13, D9=P1_14, D10=P1_15
row_pins = ["P1_14", "P1_13", "P1_12", "P1_11"]
col_pins = ["P1_15", "P0_29", "P0_28", "P0_03", "P0_02"]

[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 5
ble_addr = [0x7e, 0xfe, 0x73, 0x9e, 0x66, 0xe3]
# Same custom XIAO battery ADC and safe divider-enable handling as the central.

[split.peripheral.matrix]
matrix_type = "normal"
# Same row pins as central, mirrored column pins
row_pins = ["P1_14", "P1_13", "P1_12", "P1_11"]
col_pins = ["P0_02", "P0_03", "P0_28", "P0_29", "P1_15"]
